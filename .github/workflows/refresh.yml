# Refreshes prices every day and publishes the data files to the `data` branch.
# The website downloads them from there every 6 hours.
name: Refresh prices
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: chmod +x node_modules/7zip-bin/linux/x64/7za
      - name: Get yesterday's data
        run: |
          git fetch origin data --depth=1 || echo "no data branch yet"
          git show origin/data:history.json > data/history.json || rm -f data/history.json
          git show origin/data:cm-map.json > data/cm-map.json || rm -f data/cm-map.json
      - run: npm run refresh
      - name: Publish to the data branch
        run: |
          mkdir /tmp/out && cp data/catalog.json data/history.json data/history.bin data/history-index.json data/cardmarket.json data/cm-map.json /tmp/out/
          cd /tmp/out
          git init -q -b data
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add . && git commit -qm "Prices $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
